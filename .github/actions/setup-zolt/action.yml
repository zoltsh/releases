name: Set up trusted Zolt
description: Build the release controller with a reviewed Zolt revision

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
      with:
        distribution: temurin
        java-version: '21'

    - name: Check out trusted Zolt
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: zoltsh/zolt
        ref: ec2351c8774658f8790b47ea8081b7b8d1343938
        path: .zolt-bootstrap/source
        persist-credentials: false
