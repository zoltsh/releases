name: Set up pinned Zolt
description: Install the exact native Zolt binary used by the release controller

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
      with:
        distribution: temurin
        java-version: '21'

    - name: Install pinned Zolt
      uses: zoltsh/setup-zolt@e390469ef48c507fd952d23368b855d19fa94064 # v1.0.1
      with:
        channel: zap
        version: 0.1.0-zap.20260804.89fc63944134
        sha256: 3612c43851574bc988f5a113f7d646acf88aba1dedca3593f8f8f92c87162276
