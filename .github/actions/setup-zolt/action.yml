name: Set up pinned Zolt
description: Install the exact native Zolt binary used by the release controller

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
      with:
        distribution: temurin
        java-version: '21'

    - name: Install pinned Zolt
      shell: bash
      env:
        ZOLT_VERSION: 0.1.0-zap.20260804.89fc63944134
        ZOLT_ARCHIVE_URL: https://github.com/zoltsh/releases/releases/download/zolt-zap-0.1.0-zap.20260804.89fc63944134/zolt-0.1.0-zap.20260804.89fc63944134-linux-x64.tar.gz
        ZOLT_ARCHIVE_SHA256: 3612c43851574bc988f5a113f7d646acf88aba1dedca3593f8f8f92c87162276
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/zolt-${ZOLT_VERSION}-linux-x64.tar.gz"
        install_root="${RUNNER_TEMP}/zolt-${ZOLT_VERSION}"
        mkdir -p "$install_root"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
          "$ZOLT_ARCHIVE_URL" -o "$archive"
        printf '%s  %s\n' "$ZOLT_ARCHIVE_SHA256" "$archive" | sha256sum -c -
        tar -xzf "$archive" -C "$install_root" --strip-components=1
        test -x "$install_root/bin/zolt"
        actual_version="$("$install_root/bin/zolt" --version)"
        test "$actual_version" = "$ZOLT_VERSION"
        printf 'Zolt %s\n' "$actual_version"
        printf '%s\n' "$install_root/bin" >> "$GITHUB_PATH"
