name: Set up pinned Zolt
description: Install the exact native Zolt binary used by the release controller

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
      with:
        distribution: temurin
        java-version: '21'

    - name: Install pinned Zolt
      shell: bash
      env:
        ZOLT_VERSION: 0.1.0-zap.20260728.ec2351c87746
        ZOLT_ARCHIVE_URL: https://dist.zolt.sh/artifacts/zap/0.1.0-zap.20260728.ec2351c87746/zolt-0.1.0-zap.20260728.ec2351c87746-linux-x64.tar.gz
        ZOLT_ARCHIVE_SHA256: 466b8d45f69781c81ba4851a70cc9682c27debeac5e9917f6d16346cdab37e42
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/zolt-${ZOLT_VERSION}-linux-x64.tar.gz"
        install_root="${RUNNER_TEMP}/zolt-${ZOLT_VERSION}"
        mkdir -p "$install_root"
        curl -fsSL "$ZOLT_ARCHIVE_URL" -o "$archive"
        printf '%s  %s\n' "$ZOLT_ARCHIVE_SHA256" "$archive" | sha256sum -c -
        tar -xzf "$archive" -C "$install_root" --strip-components=1
        test -x "$install_root/bin/zolt"
        actual_version="$("$install_root/bin/zolt" --version)"
        test "$actual_version" = "$ZOLT_VERSION"
        printf 'Zolt %s\n' "$actual_version"
        printf '%s\n' "$install_root/bin" >> "$GITHUB_PATH"
