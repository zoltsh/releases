name: Set up pinned Zolt
description: Install the exact native Zolt binary used by the release controller

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
      with:
        distribution: temurin
        java-version: '21'

    - name: Install pinned Zolt
      uses: zoltsh/setup-zolt@daaac64a8f2b58dd8ee0ab53b16085a64e20a0ad # v1.0.2
      with:
        channel: zap
        version: 0.1.0-zap.20260823.0ea7fe1473b4
        sha256: 11c55e4117d55d1776c5eddca801b8e5f65cc9b16f2c5a8313b9f473547fdd57
