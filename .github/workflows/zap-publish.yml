name: zap publish
run-name: publish zap candidate ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["zap candidate"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: zap-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'zoltsh/releases'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: channel-zap

    steps:
      - name: Check out exact trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Confirm trusted controller identity
        env:
          CANDIDATE_CONTROLLER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_CONTROLLER_SHA"

      - name: Set up trusted Zolt
        uses: ./.github/actions/setup-zolt

      - name: Resolve trusted controller
        run: zolt resolve --locked --quiet --no-progress --color never

      - name: Download Linux x64 candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: zolt-zap-linux-x64
          path: candidate/zolt-zap-linux-x64
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Download Linux arm64 candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: zolt-zap-linux-arm64
          path: candidate/zolt-zap-linux-arm64
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Download macOS x64 candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: zolt-zap-macos-x64
          path: candidate/zolt-zap-macos-x64
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Download macOS arm64 candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: zolt-zap-macos-arm64
          path: candidate/zolt-zap-macos-arm64
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Download source CI evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: zolt-source-ci-evidence
          path: evidence
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Download candidate release record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: zolt-zap-release-record
          path: record
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Independently reverify source CI evidence
        env:
          ZOLT_SOURCE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_repository="$(jq -er '.source.repository' record/release-record.json)"
          source_sha="$(jq -er '.source.commit' record/release-record.json)"
          source_run_id="$(jq -er '.source.workflowRunId' record/release-record.json)"
          [[ "$source_repository" == "zoltsh/zolt" ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_run_id" =~ ^[0-9]+$ ]]
          zolt run --quiet -- verify-source-run \
              --repository "$source_repository" \
              --source-sha "$source_sha" \
              --run-id "$source_run_id" \
              --output out/reverified-source-run.json
          cmp evidence/source-run.json out/reverified-source-run.json

      - name: Fetch current signed zap metadata
        run: |
          set -euo pipefail
          mkdir -p current/channels current/releases
          curl --proto '=https' --tlsv1.2 -fsSLo current/channels/zap.json \
              https://dist.zolt.sh/channels/zap.json
          curl --proto '=https' --tlsv1.2 -fsSLo current/channels/zap.json.sig \
              https://dist.zolt.sh/channels/zap.json.sig
          curl --proto '=https' --tlsv1.2 -fsSLo current/releases/zap.json \
              https://dist.zolt.sh/releases/zap.json
          curl --proto '=https' --tlsv1.2 -fsSLo current/releases/zap.json.sig \
              https://dist.zolt.sh/releases/zap.json.sig
          zolt run --quiet -- verify-release-file \
              --input current/channels/zap.json \
              --signature current/channels/zap.json.sig
          zolt run --quiet -- verify-release-file \
              --input current/releases/zap.json \
              --signature current/releases/zap.json.sig

      - name: Revalidate and stage exact publication
        env:
          CANDIDATE_CONTROLLER_RUN_ID: ${{ github.event.workflow_run.id }}
          CANDIDATE_CONTROLLER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          zolt run --quiet -- prepare-zap-publication \
              --release-record record/release-record.json \
              --source-evidence evidence/source-run.json \
              --candidates candidate \
              --previous-channel current/channels/zap.json \
              --previous-index current/releases/zap.json \
              --expected-controller-sha "$CANDIDATE_CONTROLLER_SHA" \
              --expected-controller-run-id "$CANDIDATE_CONTROLLER_RUN_ID" \
              --output out/publication

      - name: Refuse stale or divergent source history
        run: |
          set -euo pipefail
          candidate_commit="$(jq -er '.source.commit' record/release-record.json)"
          current_commit="$(jq -er '.commit' current/channels/zap.json)"
          git init source-history
          git -C source-history remote add origin https://github.com/zoltsh/zolt.git
          git -C source-history fetch --filter=blob:none --no-tags \
              origin refs/heads/main:refs/remotes/origin/main
          git -C source-history cat-file -e "${candidate_commit}^{commit}"
          git -C source-history cat-file -e "${current_commit}^{commit}"
          git -C source-history merge-base --is-ancestor \
              "$current_commit" "$candidate_commit"
          git -C source-history merge-base --is-ancestor \
              "$candidate_commit" refs/remotes/origin/main

      - name: Sign trusted zap metadata
        env:
          ZOLT_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.ZOLT_RELEASE_ED25519_PRIVATE_KEY }}
        run: |
          zolt run --quiet -- sign-release-file \
              --input out/publication/releases/zap.json \
              --signature out/publication/releases/zap.json.sig \
              --private-key-env ZOLT_RELEASE_ED25519_PRIVATE_KEY
          zolt run --quiet -- sign-release-file \
              --input out/publication/channels/zap.json \
              --signature out/publication/channels/zap.json.sig \
              --private-key-env ZOLT_RELEASE_ED25519_PRIVATE_KEY
          zolt run --quiet -- verify-release-file \
              --input out/publication/releases/zap.json \
              --signature out/publication/releases/zap.json.sig
          zolt run --quiet -- verify-release-file \
              --input out/publication/channels/zap.json \
              --signature out/publication/channels/zap.json.sig

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_CONTROLLER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          scripts/publish-github-release \
              --channel zap \
              --publication out/publication \
              --target-sha "$CANDIDATE_CONTROLLER_SHA"

      - name: Move signed zap channel metadata last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: nyc3
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_MAX_ATTEMPTS: "1"
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          scripts/publish-channel-metadata \
              --channel zap \
              --publication out/publication \
              --expected-current-channel current/channels/zap.json

      - name: Verify public zap publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
              if curl --proto '=https' --tlsv1.2 -fsSLo out/public-channel.json \
                      https://dist.zolt.sh/channels/zap.json \
                  && curl --proto '=https' --tlsv1.2 -fsSLo out/public-channel.json.sig \
                      https://dist.zolt.sh/channels/zap.json.sig \
                  && curl --proto '=https' --tlsv1.2 -fsSLo out/public-index.json \
                      https://dist.zolt.sh/releases/zap.json \
                  && curl --proto '=https' --tlsv1.2 -fsSLo out/public-index.json.sig \
                      https://dist.zolt.sh/releases/zap.json.sig \
                  && cmp -s out/publication/channels/zap.json out/public-channel.json \
                  && cmp -s out/publication/channels/zap.json.sig out/public-channel.json.sig \
                  && cmp -s out/publication/releases/zap.json out/public-index.json \
                  && cmp -s out/publication/releases/zap.json.sig out/public-index.json.sig \
                  && zolt run --quiet -- verify-release-file \
                      --input out/public-channel.json \
                      --signature out/public-channel.json.sig \
                  && zolt run --quiet -- verify-release-file \
                      --input out/public-index.json \
                      --signature out/public-index.json.sig; then
                  version="$(jq -er '.version' out/public-channel.json)"
                  tag="zolt-zap-${version}"
                  gh release view "$tag" \
                      --repo zoltsh/releases \
                      --json isDraft,isImmutable,isPrerelease,tagName \
                      --jq ".tagName == \"$tag\" and .isDraft == false and .isImmutable == true and .isPrerelease == true" \
                      | grep -Fx true >/dev/null
                  while IFS= read -r asset_url; do
                      curl --proto '=https' --tlsv1.2 -fsSIL "$asset_url" >/dev/null
                  done < <(jq -r '.artifacts[] | .archiveUrl, .checksumUrl' out/public-channel.json)
                  cat out/public-channel.json >> "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi
              printf 'Public metadata has not converged after attempt %s\n' "$attempt"
              sleep 10
          done
          printf 'error: public zap metadata did not converge to the staged signed files\n' >&2
          exit 1
