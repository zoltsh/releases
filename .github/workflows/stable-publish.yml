name: stable publish
run-name: publish stable candidate ${{ inputs.candidate_run_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful stable candidate run from trusted controller main
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: zolt-distribution-publication
  cancel-in-progress: false

jobs:
  publish-immutable:
    if: startsWith(github.ref, 'refs/tags/zolt-v')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: channel-stable-signing
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}

    steps:
      - name: Check out exact trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm trusted controller identity
        env:
          CANDIDATE_CONTROLLER_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_CONTROLLER_SHA"

      - name: Verify protected controller tag and exact candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONTROLLER_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CONTROLLER_TAG" =~ ^zolt-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh api "repos/zoltsh/releases/git/ref/tags/$CONTROLLER_TAG" \
              | jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' >/dev/null
          gh api "repos/zoltsh/releases/actions/runs/$CANDIDATE_RUN_ID" \
              | jq -e --arg sha "$GITHUB_SHA" '
                  .name == "stable candidate" and
                  .path == ".github/workflows/stable.yml" and
                  .event == "workflow_dispatch" and
                  .head_branch == "main" and
                  .head_repository.full_name == "zoltsh/releases" and
                  .head_sha == $sha and
                  .status == "completed" and
                  .conclusion == "success"' >/dev/null

      - name: Verify stable signing approval protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/zoltsh/releases/environments/channel-stable-signing \
              | jq -e 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) >= 1)' >/dev/null

      - name: Set up trusted Zolt
        uses: ./.github/actions/setup-zolt

      - name: Resolve trusted controller
        run: zolt resolve --locked --quiet --no-progress --color never

      - name: Download candidate files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: zolt-stable-*
          path: candidate-downloads
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          digest-mismatch: error

      - name: Download source trust evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: zolt-source-ci-evidence-stable
          path: candidate-downloads/zolt-source-ci-evidence-stable
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          digest-mismatch: error

      - name: Arrange exact candidate inputs
        run: |
          set -euo pipefail
          mkdir -p candidate evidence record
          for target in linux-x64 linux-arm64 macos-x64 macos-arm64; do
              mv "candidate-downloads/zolt-stable-${target}" "candidate/zolt-stable-${target}"
          done
          mv candidate-downloads/zolt-source-ci-evidence-stable/* evidence/
          mv candidate-downloads/zolt-stable-release-record/release-record.json record/
          rmdir candidate-downloads/zolt-source-ci-evidence-stable
          rmdir candidate-downloads/zolt-stable-release-record
          rmdir candidate-downloads

      - name: Independently reverify source trust evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ZOLT_SOURCE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_repository="$(jq -er '.source.repository' record/release-record.json)"
          source_sha="$(jq -er '.source.commit' record/release-record.json)"
          source_run_id="$(jq -er '.source.workflowRunId' record/release-record.json)"
          source_tag="$(jq -er '.source.tag' record/release-record.json)"
          test "zolt-v$(jq -er '.version' record/release-record.json)" = "$GITHUB_REF_NAME"
          [[ "$source_repository" == "zoltsh/zolt" ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_run_id" =~ ^[0-9]+$ ]]
          [[ "$source_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          zolt run --quiet -- verify-source-run \
              --repository "$source_repository" \
              --source-sha "$source_sha" \
              --run-id "$source_run_id" \
              --output out/reverified-source-run.json
          gh api --paginate --slurp \
              "repos/${source_repository}/actions/runs/${source_run_id}/jobs?filter=latest&per_page=100" \
              | jq -e '[.[].jobs[] | select(.name == "stable Java lifecycle")] | length == 1 and all(.[]; .conclusion == "success")' >/dev/null
          cmp evidence/source-run.json out/reverified-source-run.json
          gh api "repos/${source_repository}/git/ref/tags/${source_tag}" \
              > out/reverified-tag-ref.json
          tag_object_sha="$(jq -er 'select(.object.type == "tag") | .object.sha' \
              out/reverified-tag-ref.json)"
          gh api "repos/${source_repository}/git/tags/${tag_object_sha}" \
              > out/reverified-tag.json
          cmp evidence/source-tag-ref.json out/reverified-tag-ref.json
          cmp evidence/source-tag.json out/reverified-tag.json
          jq -e \
              --arg tag "$source_tag" \
              --arg sha "$source_sha" '
              .tag == $tag and
              .object.type == "commit" and
              .object.sha == $sha and
              .verification.verified == true and
              .verification.reason == "valid"
          ' out/reverified-tag.json >/dev/null

      - name: Fetch current signed stable metadata
        id: current-state
        run: |
          set -euo pipefail
          mkdir -p current/channels current/releases prior
          status="$(curl --proto '=https' --tlsv1.2 -sS \
              -o current/channels/stable.json \
              -w '%{http_code}' https://dist.zolt.sh/channels/stable.json || true)"
          case "$status" in
              200)
                  curl --proto '=https' --tlsv1.2 -fsSLo current/channels/stable.json.sig \
                      https://dist.zolt.sh/channels/stable.json.sig
                  curl --proto '=https' --tlsv1.2 -fsSLo current/releases/stable.json \
                      https://dist.zolt.sh/releases/stable.json
                  curl --proto '=https' --tlsv1.2 -fsSLo current/releases/stable.json.sig \
                      https://dist.zolt.sh/releases/stable.json.sig
                  zolt run --quiet -- verify-release-file --channel stable \
                      --input current/channels/stable.json \
                      --signature current/channels/stable.json.sig
                  zolt run --quiet -- verify-release-file --channel stable \
                      --input current/releases/stable.json \
                      --signature current/releases/stable.json.sig
                  cp -R current/channels current/releases prior/
                  printf 'present\n' > prior/state
                  printf 'present=true\n' >> "$GITHUB_OUTPUT"
                  ;;
              404)
                  rm -f current/channels/stable.json
                  for url in \
                      https://dist.zolt.sh/channels/stable.json.sig \
                      https://dist.zolt.sh/releases/stable.json \
                      https://dist.zolt.sh/releases/stable.json.sig; do
                      code="$(curl --proto '=https' --tlsv1.2 -sS \
                          -o /dev/null -w '%{http_code}' "$url" || true)"
                      test "$code" = 404
                  done
                  printf 'absent\n' > prior/state
                  printf 'present=false\n' >> "$GITHUB_OUTPUT"
                  ;;
              *)
                  printf 'error: stable channel lookup returned HTTP %s\n' "$status" >&2
                  exit 1
                  ;;
          esac

      - name: Revalidate and stage exact stable publication
        env:
          CANDIDATE_CONTROLLER_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_CONTROLLER_SHA: ${{ github.sha }}
          CURRENT_PRESENT: ${{ steps.current-state.outputs.present }}
        run: |
          set -euo pipefail
          args=(
              --release-record record/release-record.json
              --source-evidence evidence/source-run.json
              --candidates candidate
              --expected-controller-sha "$CANDIDATE_CONTROLLER_SHA"
              --expected-controller-run-id "$CANDIDATE_CONTROLLER_RUN_ID"
              --output out/publication
          )
          if [[ "$CURRENT_PRESENT" == true ]]; then
              args+=(
                  --previous-channel current/channels/stable.json
                  --previous-index current/releases/stable.json
              )
          fi
          zolt run --quiet -- prepare-stable-publication "${args[@]}"

      - name: Refuse a moved or untagged source commit
        run: |
          set -euo pipefail
          candidate_commit="$(jq -er '.source.commit' record/release-record.json)"
          source_tag="$(jq -er '.source.tag' record/release-record.json)"
          git init source-history
          git -C source-history remote add origin https://github.com/zoltsh/zolt.git
          git -C source-history fetch --filter=blob:none --no-tags \
              origin refs/heads/main:refs/remotes/origin/main
          git -C source-history fetch --no-tags --depth=1 \
              origin "refs/tags/${source_tag}:refs/tags/${source_tag}"
          test "$(git -C source-history cat-file -t "refs/tags/${source_tag}")" = tag
          test "$(git -C source-history rev-parse "refs/tags/${source_tag}^{commit}")" = \
              "$candidate_commit"
          git -C source-history merge-base --is-ancestor \
              "$candidate_commit" refs/remotes/origin/main

      - name: Stage exact source-tag installer
        run: |
          set -euo pipefail
          candidate_commit="$(jq -er '.source.commit' record/release-record.json)"
          version="$(jq -er '.version' record/release-record.json)"
          version_directory="out/publication/artifacts/stable/$version"
          installer="$version_directory/install.sh"
          test "$(git -C source-history ls-tree "$candidate_commit" -- scripts/install-zolt \
              | awk '{ print $1 " " $2 }')" = "100755 blob"
          git -C source-history show "$candidate_commit:scripts/install-zolt" > "$installer"
          chmod 0755 "$installer"
          test "$(head -n 1 "$installer")" = '#!/bin/sh'
          sh -n "$installer"
          cp evidence/source-tag-ref.json "$version_directory/source-tag-ref.json"
          cp evidence/source-tag.json "$version_directory/source-tag.json"

      - name: Sign trusted stable metadata
        env:
          ZOLT_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.ZOLT_RELEASE_ED25519_PRIVATE_KEY }}
        run: |
          zolt run --quiet -- sign-release-file --channel stable \
              --input out/publication/releases/stable.json \
              --signature out/publication/releases/stable.json.sig \
              --private-key-env ZOLT_RELEASE_ED25519_PRIVATE_KEY
          zolt run --quiet -- sign-release-file --channel stable \
              --input out/publication/channels/stable.json \
              --signature out/publication/channels/stable.json.sig \
              --private-key-env ZOLT_RELEASE_ED25519_PRIVATE_KEY
          zolt run --quiet -- verify-release-file --channel stable \
              --input out/publication/releases/stable.json \
              --signature out/publication/releases/stable.json.sig
          zolt run --quiet -- verify-release-file --channel stable \
              --input out/publication/channels/stable.json \
              --signature out/publication/channels/stable.json.sig

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_CONTROLLER_SHA: ${{ github.sha }}
        run: |
          scripts/publish-github-release \
              --channel stable \
              --publication out/publication \
              --target-sha "$CANDIDATE_CONTROLLER_SHA"

      - name: Record immutable release identity
        id: identity
        run: |
          set -euo pipefail
          version="$(jq -er '.version' out/publication/channels/stable.json)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=zolt-v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Preserve signed publication for promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stable-signed-publication
          path: out/publication/**
          if-no-files-found: error
          retention-days: 30

      - name: Preserve prior public state for compare-and-swap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stable-prior-state
          path: prior/**
          if-no-files-found: error
          retention-days: 30

  immutable-release-canary:
    needs: publish-immutable
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up trusted Zolt
        uses: ./.github/actions/setup-zolt

      - name: Resolve trusted controller
        run: zolt resolve --locked --quiet --no-progress --color never

      - name: Install and execute exact immutable stable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish-immutable.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.publish-immutable.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo zoltsh/releases \
              --json isDraft,isImmutable,isPrerelease,tagName \
              --jq ".tagName == \"$RELEASE_TAG\" and .isDraft == false and .isImmutable == true and .isPrerelease == false" \
              | grep -Fx true >/dev/null
          mkdir immutable
          gh release download "$RELEASE_TAG" --repo zoltsh/releases \
              --pattern install.sh \
              --pattern channel-stable.json \
              --pattern channel-stable.json.sig \
              --dir immutable
          zolt run --quiet -- verify-release-file --channel stable \
              --input immutable/channel-stable.json \
              --signature immutable/channel-stable.json.sig
          install_root="$RUNNER_TEMP/immutable-stable"
          channel_url="file://$PWD/immutable/channel-stable.json"
          ZOLT_INSTALL_ROOT="$install_root" \
              ZOLT_INSTALL_CHANNEL=stable \
              ZOLT_INSTALL_CHANNEL_URL="$channel_url" \
              ZOLT_INSTALL_UPDATE_CHANNEL_URL=https://dist.zolt.sh/channels/stable.json \
              ZOLT_INSTALL_TARGET=linux-x64 \
              sh immutable/install.sh
          test "$("$install_root/bin/zolt" --version)" = "$EXPECTED_VERSION"
          test "$(cat "$install_root/channel-url")" = \
              'https://dist.zolt.sh/channels/stable.json'

  promote:
    needs:
      - publish-immutable
      - immutable-release-canary
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: channel-stable
    outputs:
      version: ${{ steps.public-verification.outputs.version }}

    steps:
      - name: Check out exact trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up trusted Zolt
        uses: ./.github/actions/setup-zolt

      - name: Resolve trusted controller
        run: zolt resolve --locked --quiet --no-progress --color never

      - name: Download signed publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: stable-signed-publication
          path: publication
          digest-mismatch: error

      - name: Download prior public state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: stable-prior-state
          path: prior
          digest-mismatch: error

      - name: Reverify immutable release and signed bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish-immutable.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo zoltsh/releases \
              --json isDraft,isImmutable,isPrerelease,tagName \
              --jq ".tagName == \"$RELEASE_TAG\" and .isDraft == false and .isImmutable == true and .isPrerelease == false" \
              | grep -Fx true >/dev/null
          mkdir immutable
          gh release download "$RELEASE_TAG" --repo zoltsh/releases \
              --pattern channel-stable.json \
              --pattern channel-stable.json.sig \
              --pattern release-index-stable.json \
              --pattern release-index-stable.json.sig \
              --dir immutable
          cmp publication/channels/stable.json immutable/channel-stable.json
          cmp publication/channels/stable.json.sig immutable/channel-stable.json.sig
          cmp publication/releases/stable.json immutable/release-index-stable.json
          cmp publication/releases/stable.json.sig immutable/release-index-stable.json.sig
          zolt run --quiet -- verify-release-file --channel stable \
              --input publication/channels/stable.json \
              --signature publication/channels/stable.json.sig
          zolt run --quiet -- verify-release-file --channel stable \
              --input publication/releases/stable.json \
              --signature publication/releases/stable.json.sig
          while IFS= read -r asset_url; do
              curl --proto '=https' --tlsv1.2 -fsSIL "$asset_url" >/dev/null
          done < <(jq -r '.artifacts[] | .archiveUrl, .checksumUrl' \
              publication/channels/stable.json)

      - name: Reverify prior public state
        id: prior-state
        run: |
          set -euo pipefail
          state="$(cat prior/state)"
          # A prior attempt may have moved metadata before bootstrap publication failed.
          # Reuse only an exact match to all four already-verified signed files.
          mkdir -p resumed/channels resumed/releases
          exact=true
          for key in channels/stable.json channels/stable.json.sig releases/stable.json releases/stable.json.sig; do
              if ! curl --proto '=https' --tlsv1.2 -fsSLo "resumed/$key" "https://dist.zolt.sh/$key" \
                  || ! cmp -s "publication/$key" "resumed/$key"; then
                  exact=false
              fi
          done
          if [[ "$exact" == true ]]; then
              printf 'already_current=true\n' >> "$GITHUB_OUTPUT"
              exit 0
          fi
          case "$state" in
              present)
                  mkdir -p current/channels current/releases
                  curl --proto '=https' --tlsv1.2 -fsSLo current/channels/stable.json \
                      https://dist.zolt.sh/channels/stable.json
                  curl --proto '=https' --tlsv1.2 -fsSLo current/channels/stable.json.sig \
                      https://dist.zolt.sh/channels/stable.json.sig
                  curl --proto '=https' --tlsv1.2 -fsSLo current/releases/stable.json \
                      https://dist.zolt.sh/releases/stable.json
                  curl --proto '=https' --tlsv1.2 -fsSLo current/releases/stable.json.sig \
                      https://dist.zolt.sh/releases/stable.json.sig
                  cmp prior/channels/stable.json current/channels/stable.json
                  cmp prior/channels/stable.json.sig current/channels/stable.json.sig
                  cmp prior/releases/stable.json current/releases/stable.json
                  cmp prior/releases/stable.json.sig current/releases/stable.json.sig
                  zolt run --quiet -- verify-release-file --channel stable \
                      --input current/channels/stable.json \
                      --signature current/channels/stable.json.sig
                  zolt run --quiet -- verify-release-file --channel stable \
                      --input current/releases/stable.json \
                      --signature current/releases/stable.json.sig
                  printf 'present=true\n' >> "$GITHUB_OUTPUT"
                  ;;
              absent)
                  status="$(curl --proto '=https' --tlsv1.2 -sS \
                      -o /dev/null -w '%{http_code}' \
                      https://dist.zolt.sh/channels/stable.json || true)"
                  test "$status" = 404
                  printf 'present=false\n' >> "$GITHUB_OUTPUT"
                  ;;
              *)
                  printf 'error: invalid prior stable state %s\n' "$state" >&2
                  exit 1
                  ;;
          esac

      - name: Move signed stable channel metadata last
        if: steps.prior-state.outputs.already_current != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
          CURRENT_PRESENT: ${{ steps.prior-state.outputs.present }}
        run: |
          set -euo pipefail
          args=(--channel stable --publication publication)
          if [[ "$CURRENT_PRESENT" == true ]]; then
              args+=(--expected-current-channel current/channels/stable.json)
          else
              args+=(--expect-current-absent)
          fi
          scripts/publish-channel-metadata "${args[@]}"

      - name: Publish stable installer bootstrap
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        run: scripts/publish-installer-bootstrap --channel stable --publication publication

      - name: Verify public stable publication
        id: public-verification
        run: |
          set -euo pipefail
          mkdir -p out
          for attempt in 1 2 3 4 5 6; do
              if curl --proto '=https' --tlsv1.2 -fsSLo out/public-channel.json \
                      https://dist.zolt.sh/channels/stable.json \
                  && curl --proto '=https' --tlsv1.2 -fsSLo out/public-channel.json.sig \
                      https://dist.zolt.sh/channels/stable.json.sig \
                  && curl --proto '=https' --tlsv1.2 -fsSLo out/public-index.json \
                      https://dist.zolt.sh/releases/stable.json \
                  && curl --proto '=https' --tlsv1.2 -fsSLo out/public-index.json.sig \
                      https://dist.zolt.sh/releases/stable.json.sig \
                  && cmp -s publication/channels/stable.json out/public-channel.json \
                  && cmp -s publication/channels/stable.json.sig out/public-channel.json.sig \
                  && cmp -s publication/releases/stable.json out/public-index.json \
                  && cmp -s publication/releases/stable.json.sig out/public-index.json.sig \
                  && zolt run --quiet -- verify-release-file --channel stable \
                      --input out/public-channel.json \
                      --signature out/public-channel.json.sig \
                  && zolt run --quiet -- verify-release-file --channel stable \
                      --input out/public-index.json \
                      --signature out/public-index.json.sig; then
                  version="$(jq -er '.version' out/public-channel.json)"
                  printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
                  cat out/public-channel.json >> "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi
              printf 'Public stable metadata has not converged after attempt %s\n' "$attempt"
              sleep 10
          done
          printf 'error: public stable metadata did not converge to signed release bytes\n' >&2
          exit 1

  post-publication-smoke:
    needs: promote
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install and execute public stable without publication authority
        env:
          EXPECTED_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
              -fsSLo public-installer.sh \
              https://dist.zolt.sh/install.sh
          sh -n public-installer.sh
          install_root="$RUNNER_TEMP/public-stable"
          ZOLT_INSTALL_ROOT="$install_root" \
              ZOLT_INSTALL_TARGET=linux-x64 \
              sh public-installer.sh
          test "$("$install_root/bin/zolt" --version)" = "$EXPECTED_VERSION"
          test "$(cat "$install_root/channel-url")" = \
              'https://dist.zolt.sh/channels/stable.json'
