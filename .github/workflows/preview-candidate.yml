name: preview candidate
run-name: preview candidate ${{ inputs.source_tag }}

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Allowlisted Zolt source repository
        required: true
        type: string
      source_sha:
        description: Exact 40-character source commit
        required: true
        type: string
      source_tag:
        description: Protected signed prerelease tag, such as v0.1.0-alpha.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-candidate-${{ inputs.source_repository }}-${{ inputs.source_tag }}
  cancel-in-progress: false

jobs:
  validate-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_repository: ${{ steps.intent.outputs.source_repository }}
      source_sha: ${{ steps.intent.outputs.source_sha }}
      source_run_id: ${{ steps.source-run.outputs.source_run_id }}
      source_tag: ${{ steps.intent.outputs.source_tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up trusted Zolt
        uses: ./.github/actions/setup-zolt

      - name: Resolve trusted controller
        run: zolt resolve --locked --quiet --no-progress --color never

      - name: Validate preview intent
        id: intent
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          zolt run --quiet -- validate-intent \
              --channel preview \
              --source-repository "$SOURCE_REPOSITORY" \
              --source-sha "$SOURCE_SHA" \
              --source-tag "$SOURCE_TAG"
          {
              printf 'source_repository=%s\n' "$SOURCE_REPOSITORY"
              printf 'source_sha=%s\n' "$SOURCE_SHA"
              printf 'source_tag=%s\n' "$SOURCE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Verify protected signed source tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh api "repos/${SOURCE_REPOSITORY}/git/ref/tags/${SOURCE_TAG}" > out/source-tag-ref.json
          tag_object_sha="$(jq -er '
              select(.object.type == "tag") | .object.sha
          ' out/source-tag-ref.json)"
          gh api "repos/${SOURCE_REPOSITORY}/git/tags/${tag_object_sha}" > out/source-tag.json
          jq -e \
              --arg tag "$SOURCE_TAG" \
              --arg sha "$SOURCE_SHA" '
              .tag == $tag and
              .object.type == "commit" and
              .object.sha == $sha and
              .verification.verified == true and
              .verification.reason == "valid"
          ' out/source-tag.json >/dev/null

      - name: Find and independently verify source CI
        id: source-run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ZOLT_SOURCE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
              "repos/${SOURCE_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=${SOURCE_SHA}&per_page=100" \
              > out/source-runs.json
          source_run_id="$(jq -er \
              --arg sha "$SOURCE_SHA" '
              [.workflow_runs[] |
                select(
                  .name == "ci" and
                  .path == ".github/workflows/ci.yml" and
                  .event == "push" and
                  .head_branch == "main" and
                  .head_sha == $sha and
                  .status == "completed" and
                  .conclusion == "success")]
              | sort_by(.created_at, .id)
              | last
              | .id
          ' out/source-runs.json)"
          zolt run --quiet -- verify-source-run \
              --repository "$SOURCE_REPOSITORY" \
              --source-sha "$SOURCE_SHA" \
              --run-id "$source_run_id" \
              --output out/source-run.json
          printf 'source_run_id=%s\n' "$source_run_id" >> "$GITHUB_OUTPUT"
          cat out/source-run.json >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch exact protected source tag
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C source fetch --no-tags --depth=256 \
              origin refs/heads/main:refs/remotes/origin/main
          git -C source fetch --no-tags --depth=1 \
              origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          test "$(git -C source cat-file -t "refs/tags/${SOURCE_TAG}")" = tag
          test "$(git -C source rev-parse "refs/tags/${SOURCE_TAG}^{commit}")" = "$SOURCE_SHA"
          git -C source merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          git -C source checkout --detach "$SOURCE_SHA"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Derive exact preview version
        id: version
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          version="${SOURCE_TAG#v}"
          base_version="$(awk -F '"' "
              /^\\[/ { section = \$0 }
              section == \"[workspace.project]\" && /^version = / { print \$2; exit }
          " source/zolt.toml | sed "s/-SNAPSHOT$//")"
          test "${version%%-*}" = "$base_version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Preview version: \x60%s\x60\n' "$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve source trust evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zolt-source-ci-evidence-preview
          path: |
            out/source-run.json
            out/source-tag-ref.json
            out/source-tag.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: build ${{ matrix.target }}
    needs: validate-intent
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel

    env:
      SOURCE_REPOSITORY: ${{ needs.validate-intent.outputs.source_repository }}
      SOURCE_SHA: ${{ needs.validate-intent.outputs.source_sha }}
      ZOLT_RELEASE_CHANNEL: preview
      ZOLT_RELEASE_TARGET: ${{ matrix.target }}
      ZOLT_RELEASE_VERSION: ${{ needs.validate-intent.outputs.version }}

    steps:
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2
        with:
          distribution: graalvm
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch exact source commit
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C source fetch --no-tags --depth=256 \
              origin refs/heads/main:refs/remotes/origin/main
          if ! git -C source cat-file -e "${SOURCE_SHA}^{commit}" 2>/dev/null; then
              git -C source fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          fi
          git -C source merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          git -C source checkout --detach "$SOURCE_SHA"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Sync source-managed Java
        working-directory: source
        run: scripts/bootstrap-zolt-jvm --no-progress toolchain sync

      - name: Build and verify native preview distribution
        working-directory: source
        run: scripts/zap-distribution --target "$ZOLT_RELEASE_TARGET"

      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zolt-preview-${{ matrix.target }}
          path: source/apps/zolt/target/release/preview/${{ needs.validate-intent.outputs.version }}/**
          if-no-files-found: error
          retention-days: 14

  record:
    name: candidate record
    needs:
      - validate-intent
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up trusted Zolt
        uses: ./.github/actions/setup-zolt

      - name: Resolve trusted controller
        run: zolt resolve --locked --quiet --no-progress --color never

      - name: Download exact candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: zolt-preview-*
          path: candidate
          merge-multiple: false
          digest-mismatch: error

      - name: Download source trust evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: zolt-source-ci-evidence-preview
          path: evidence
          digest-mismatch: error

      - name: Write candidate release record
        env:
          SOURCE_REPOSITORY: ${{ needs.validate-intent.outputs.source_repository }}
          SOURCE_SHA: ${{ needs.validate-intent.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ needs.validate-intent.outputs.source_run_id }}
          SOURCE_TAG: ${{ needs.validate-intent.outputs.source_tag }}
          EXPECTED_VERSION: ${{ needs.validate-intent.outputs.version }}
        run: |
          zolt run --quiet -- write-release-record \
              --channel preview \
              --source-repository "$SOURCE_REPOSITORY" \
              --source-sha "$SOURCE_SHA" \
              --source-run-id "$SOURCE_RUN_ID" \
              --source-tag "$SOURCE_TAG" \
              --expected-version "$EXPECTED_VERSION" \
              --source-evidence evidence/source-run.json \
              --controller-sha "$GITHUB_SHA" \
              --controller-run-id "$GITHUB_RUN_ID" \
              --candidates candidate \
              --output out/release-record.json
          cat out/release-record.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate release record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zolt-preview-release-record
          path: out/release-record.json
          if-no-files-found: error
          retention-days: 30
