name: preview intent
run-name: preview intent ${{ inputs.source_tag }}

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Allowlisted Zolt source repository
        required: true
        type: string
      source_sha:
        description: Exact 40-character source commit
        required: true
        type: string
      source_tag:
        description: Protected prerelease tag, such as v0.2.0-rc.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up trusted Zolt
        uses: ./.github/actions/setup-zolt

      - name: Resolve trusted controller
        run: zolt resolve --locked --quiet --no-progress --color never

      - name: Validate preview intent
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          zolt run --quiet -- validate-intent \
              --channel preview \
              --source-repository "$SOURCE_REPOSITORY" \
              --source-sha "$SOURCE_SHA" \
              --source-tag "$SOURCE_TAG"
          printf 'Preview intent is valid. This workflow never builds or publishes.\n' >> "$GITHUB_STEP_SUMMARY"
